name = "putzplan-zentrale"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "PUTZPLAN"
class_name = "Putzplan"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Putzplan"]

# Jede volle Stunde prüfen; der Code entscheidet nach Berliner Zeit,
# ob Sonntag 19 Uhr oder Freitag 18 Uhr ist.
[triggers]
crons = ["0 * * * *"]

# Übersetzen von Beiträgen (Workers AI, kostenloses Tageskontingent)
[ai]
binding = "AI"
